<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A50" />
      <stop offset="60%" stop-color="#E05A36" />
      <stop offset="100%" stop-color="#A53518" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8DF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE8DF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7B2D19" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background circle soft cream -->
  <rect width="512" height="512" rx="128" fill="#FFF9F5" />
  <circle cx="256" cy="256" r="220" fill="#FFF0E6" />
  
  <!-- Warm incubator egg -->
  <g filter="url(#shadow)">
    <!-- Egg path: narrower top, wider bottom -->
    <path d="M 256 90 C 175 90 140 220 140 320 C 140 405 190 440 256 440 C 322 440 372 405 372 320 C 372 220 337 90 256 90 Z" fill="url(#eggGrad)"/>
    <ellipse cx="225" cy="190" rx="45" ry="75" transform="rotate(-25 225 190)" fill="url(#glow)"/>
  </g>

  <!-- WiFi & Microcontroller symbol overlay -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <!-- WiFi waves -->
    <path d="M 196 270 A 70 70 0 0 1 316 270" stroke-width="12" stroke-opacity="0.95"/>
    <path d="M 218 296 A 42 42 0 0 1 294 296" stroke-width="10" stroke-opacity="0.95"/>
    <circle cx="256" cy="322" r="7" fill="#FFFFFF"/>
    <!-- Heating temperature pulse lines -->
    <path d="M 180 375 Q 210 360 256 375 T 332 375" stroke-width="8" stroke-opacity="0.85"/>
  </g>
</svg>
